<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行程助手</title>
<style>
html{height:100%;color-scheme:light}body{height:100%;margin:0}*,*::before,*::after{box-sizing:border-box}
</style>
<style data-world-css>
/* 行程助手 · 潮汐调度台 — desktop. 白 + 紫，轻拟物。 */
:root {
  --bg: #f4f1fb;
  --bg-glow: #ebe4ff;
  --panel: #ffffff;
  --panel-2: #faf8ff;
  --ink: #2b2242;
  --ink-soft: #5d5478;
  --muted: #9189ab;
  --line: #ece7f7;
  --line-strong: #d9d0ee;
  --purple: #6f4fd8;
  --purple-deep: #5636b8;
  --purple-soft: #efeaff;
  --purple-mid: #c9bbf5;
  --danger: #c2456b;
  --danger-soft: #fbe9ef;
  --shadow-out: 7px 7px 16px #d9d2ea, -7px -7px 16px #ffffff;
  --shadow-out-sm: 3px 3px 8px #d9d2ea, -3px -3px 8px #ffffff;
  --shadow-in: inset 3px 3px 7px #dcd5ec, inset -3px -3px 7px #ffffff;
  --radius: 18px;
  --radius-sm: 12px;
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --numbers: "DIN Alternate", "Bahnschrift", "Roboto Condensed", var(--sans);
}

html, body { height: 100%; }
body {
  overflow: hidden;
  color: var(--ink);
  background: radial-gradient(1200px 700px at 12% -10%, var(--bg-glow), transparent 60%), var(--bg);
  font: 14px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.schedule-app { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; min-height: 0; }

/* 顶栏 */
.app-head {
  display: flex; align-items: center; gap: 26px;
  margin: 16px 24px 0; padding: 14px 22px;
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow-out-sm);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  display: flex; align-items: flex-end; gap: 3px; width: 34px; height: 34px; padding: 7px 6px;
  border-radius: 11px; background: var(--panel); box-shadow: var(--shadow-out-sm);
}
.brand-mark i { display: block; width: 4px; border-radius: 2px; background: var(--purple); }
.brand-mark i:nth-child(1) { height: 9px; background: var(--purple-mid); }
.brand-mark i:nth-child(2) { height: 16px; }
.brand-mark i:nth-child(3) { height: 12px; background: var(--purple-mid); }
.brand strong { display: block; font-size: 16px; letter-spacing: 0.04em; }
.brand small { display: block; color: var(--muted); font-size: 9px; letter-spacing: 0.2em; }
.head-note { color: var(--muted); font-size: 12px; }
.clock {
  display: flex; align-items: center; gap: 8px; margin-left: auto;
  padding: 7px 14px; border-radius: 999px; background: var(--panel-2); box-shadow: var(--shadow-in);
}
.clock span { color: var(--muted); font-size: 10px; letter-spacing: 0.08em; }
.clock strong { font: 13px/1.2 var(--numbers); color: var(--purple-deep); letter-spacing: 0.04em; }
.page-error {
  margin: 10px 24px 0; padding: 9px 14px; border-radius: var(--radius-sm);
  background: var(--danger-soft); color: #8a2d4a; font-size: 12px;
}

/* 主体：两栏都撑满剩余高度 */
.board {
  display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px;
  min-height: 0; height: 100%;
  padding: 18px 24px 24px;
}
.chat-column, .task-column { display: flex; flex-direction: column; min-height: 0; height: 100%; }

/* 对话卡片 */
.chat-shell {
  display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow-out);
  overflow: hidden;
}
.chat-head {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.head-index {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px;
  background: var(--purple); color: #fff; font: 11px/1 var(--numbers); box-shadow: 2px 3px 8px rgba(111,79,216,0.28);
}
.chat-head strong { display: block; font-size: 13px; }
.chat-head small { display: block; color: var(--muted); font-size: 11px; }
.online { display: flex; align-items: center; gap: 6px; margin-left: auto; color: var(--purple); font-size: 11px; }
.online i { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); box-shadow: 0 0 0 4px rgba(111,79,216,0.14); }

.messages { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px 20px 10px; }
.message { max-width: 80%; margin-bottom: 16px; }
.message--agent { padding: 12px 14px; border-radius: 4px 16px 16px 16px; background: var(--panel); box-shadow: var(--shadow-out-sm); }
.message--player {
  margin-left: auto; padding: 11px 15px; border-radius: 16px 4px 16px 16px;
  background: var(--purple-soft); box-shadow: var(--shadow-in); color: var(--ink);
}
.message--system { max-width: 100%; font-size: 12px; color: var(--ink-soft); }
.speaker { margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
.message--player .speaker { color: var(--purple); }
.message-content { font-size: 14px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
.message-actions { display: flex; gap: 12px; margin-top: 8px; }
.message-actions button { padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }
.message-actions button:hover { color: var(--purple); }
.message-image { display: block; max-width: min(100%, 360px); max-height: 250px; margin-top: 8px; border-radius: var(--radius-sm); box-shadow: var(--shadow-out-sm); object-fit: cover; }
.message-audio { display: block; width: min(100%, 320px); margin-top: 8px; }
.event { margin: 0 0 16px; padding: 9px 13px; border-radius: var(--radius-sm); background: var(--purple-soft); color: var(--purple-deep); font-size: 12px; box-shadow: var(--shadow-in); }
.tool { display: inline-block; margin-bottom: 6px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); font-size: 10px; box-shadow: var(--shadow-out-sm); }
.tool.streaming { color: var(--purple); }
.game-cot { margin: 0 0 9px; padding: 9px 11px; border-radius: var(--radius-sm); background: var(--panel-2); box-shadow: var(--shadow-in); }
.game-cot-label { color: var(--purple); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
.game-cot-content { margin-top: 4px; color: var(--ink-soft); font-size: 12px; line-height: 1.7; white-space: pre-wrap; }
.cot-toggle { margin-top: 4px; padding: 0; border: 0; background: transparent; color: var(--purple); font-size: 11px; text-decoration: underline; }
.empty { margin: 20px 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
.thinking-indicator { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 12px; }
.thinking-indicator::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--purple); animation: blink 900ms ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.25; } }

.message--interaction { max-width: 92%; padding: 14px; border-radius: var(--radius-sm); background: var(--panel); box-shadow: var(--shadow-out-sm); }
.interaction-prompt { margin-bottom: 10px; font-size: 13px; font-weight: 600; }
.interaction-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.interaction-option {
  padding: 8px 14px; border: 0; border-radius: 10px; background: var(--panel);
  color: var(--purple); font-size: 12px; font-weight: 600; box-shadow: var(--shadow-out-sm);
}
.interaction-option:hover { color: var(--purple-deep); }
.interaction-option:active { box-shadow: var(--shadow-in); }
.interaction-option:disabled { opacity: 0.5; }
.interaction-slider { width: 180px; accent-color: var(--purple); }
.interaction-slider-value { min-width: 30px; color: var(--purple); font-size: 12px; }
.interaction-answer { color: var(--purple); font-size: 12px; }

/* 输入区 */
.composer { padding: 12px 14px 10px; border-top: 1px solid var(--line); background: var(--panel); }
.attachments { display: flex; flex-wrap: wrap; gap: 6px; }
.attachments:not(:empty) { margin-bottom: 8px; }
.attachment { padding: 5px 10px; border: 0; border-radius: 999px; background: var(--panel-2); color: var(--ink-soft); font-size: 11px; box-shadow: var(--shadow-out-sm); }
.composer-row {
  display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 10px;
  border-radius: 16px; background: var(--panel-2); box-shadow: var(--shadow-in);
}
.composer-row:focus-within { box-shadow: var(--shadow-in), 0 0 0 2px var(--purple-mid); }
.icon-button {
  flex: 0 0 auto; width: 34px; height: 34px; border: 0; border-radius: 50%;
  background: var(--panel); color: var(--purple); font: 12px/1 var(--sans); box-shadow: var(--shadow-out-sm);
}
.icon-button:active { box-shadow: var(--shadow-in); }
.icon-button.recording { background: var(--danger); color: #fff; }
#input { flex: 1; min-height: 34px; max-height: 120px; padding: 7px 4px; border: 0; outline: 0; background: transparent; resize: none; font-size: 14px; line-height: 1.5; }
.send-button {
  flex: 0 0 auto; min-height: 36px; padding: 7px 18px; border: 0; border-radius: 12px;
  background: var(--purple); color: #fff; font-size: 13px; font-weight: 600; box-shadow: 3px 4px 10px rgba(111,79,216,0.3);
}
.send-button:hover { background: var(--purple-deep); }
.send-button:disabled { opacity: 0.5; }
.composer-foot { display: flex; justify-content: space-between; gap: 10px; min-height: 16px; margin-top: 6px; }
#status { color: var(--muted); font-size: 11px; }
#status.has-error { color: var(--danger); }
.text-button { padding: 0; border: 0; background: transparent; color: var(--purple); font-size: 11px; text-decoration: underline; }

/* 待办卡片 */
.task-column {
  border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow-out); overflow: hidden;
}
.task-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 18px 18px 14px; border-bottom: 1px solid var(--line);
}
.eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; }
.task-head h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--ink); }
.counts { display: flex; gap: 8px; }
.counts span {
  display: flex; align-items: baseline; gap: 4px; padding: 6px 10px; border-radius: 999px;
  background: var(--panel-2); color: var(--muted); font-size: 11px; box-shadow: var(--shadow-in);
}
.counts b { color: var(--purple-deep); font: 15px/1 var(--numbers); }
.task-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 18px 14px; }
.task-section { padding-top: 14px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 8px; }
.section-title h2 { margin: 0; font-size: 13px; font-weight: 700; }
.section-title span { color: var(--muted); font-size: 11px; }
.task-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.task-row {
  display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px;
  border-radius: var(--radius-sm); background: var(--panel); box-shadow: var(--shadow-out-sm); cursor: pointer;
}
.task-row input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--purple); }
.task-text { font-size: 13px; line-height: 1.65; }
.task-row.is-checked { background: var(--purple-soft); box-shadow: var(--shadow-in); }
.task-row.is-checked .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--purple); }
.task-row--done { cursor: default; color: var(--muted); background: var(--panel-2); box-shadow: none; }
.task-check { width: 16px; color: var(--purple); font-size: 12px; text-align: center; }
.task-row--done .task-text { font-size: 12px; text-decoration: line-through; text-decoration-color: var(--purple-mid); }
.empty-copy { margin: 10px 2px 2px; color: var(--muted); font-size: 12px; line-height: 1.7; }
.task-foot { padding: 14px 18px 16px; border-top: 1px solid var(--line); background: var(--panel-2); }
.primary-button, .ghost-button {
  width: 100%; padding: 10px 12px; border: 0; border-radius: 12px; font-size: 13px; font-weight: 600;
}
.primary-button { margin-top: 8px; background: var(--purple); color: #fff; box-shadow: 3px 4px 10px rgba(111,79,216,0.28); }
.primary-button:hover { background: var(--purple-deep); }
.primary-button:disabled { opacity: 0.45; box-shadow: none; }
.ghost-button { background: var(--panel); color: var(--ink-soft); box-shadow: var(--shadow-out-sm); }
.ghost-button:hover { color: var(--purple); }
.ghost-button:active { box-shadow: var(--shadow-in); }
.task-foot p { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
.task-foot button:focus-visible, .task-row:focus-within { outline: 2px solid var(--purple-mid); outline-offset: 2px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 20; padding: 10px 18px; border-radius: 999px;
  background: var(--purple-deep); color: #fff; font-size: 12px; opacity: 0;
  transform: translate(-50%, 8px); pointer-events: none; transition: opacity 180ms ease, transform 180ms ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1060px) {
  .board { grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; padding: 14px 16px 16px; }
  .app-head { margin: 12px 16px 0; padding: 12px 16px; }
  .head-note { display: none; }
  .page-error { margin: 8px 16px 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

</style>
</head>
<body data-platform="desktop">
<div class="schedule-app">
  <header class="app-head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <div><strong id="world-name">行程助手</strong><small>SCHEDULE DESK</small></div>
    </div>
    <div class="head-note">把要做的事拆成下一步，必要时创建系统提醒。</div>
    <div class="clock"><span>当前时间</span><strong id="time-label">实时</strong></div>
  </header>
  <div id="page-error" class="page-error" role="alert" hidden></div>

  <main class="board">
    <section class="chat-column">
      <div class="chat-shell">
        <header class="chat-head">
          <span class="head-index">01</span>
          <div><strong>对话</strong><small>说任务、时间与提醒偏好</small></div>
          <span class="online"><i></i>在线</span>
        </header>
        <div id="messages" class="messages" role="log" aria-live="polite"></div>
        <div class="composer">
          <div id="attachments" class="attachments"></div>
          <div class="composer-row">
            <button type="button" id="voice" class="icon-button" aria-label="开始录音">声</button>
            <textarea id="input" rows="1" placeholder="例如：周三下午三点提醒我交周报，提前半小时。" maxlength="4000"></textarea>
            <button type="button" id="send" class="send-button">发送</button>
          </div>
          <div class="composer-foot"><span id="status" role="status" aria-live="polite"></span><button type="button" id="cancel-edit" class="text-button" hidden>取消编辑</button></div>
        </div>
      </div>
    </section>

    <aside class="task-column">
      <header class="task-head">
        <div><p class="eyebrow">BOARD / 待办板</p><h1>下一步</h1></div>
        <div class="counts"><span><b id="todo-count">0</b>待办</span><span><b id="done-count">0</b>完成</span></div>
      </header>
      <div class="task-scroll">
        <section class="task-section">
          <header class="section-title"><h2>进行中</h2><span>由行程助手维护</span></header>
          <div id="todo-list" class="task-list"></div>
          <p id="todo-empty" class="empty-copy">还没有待办。告诉助手你要做什么，或点下面的按钮开始。</p>
        </section>
        <section class="task-section">
          <header class="section-title"><h2>已完成</h2><span>最近确认</span></header>
          <div id="done-list" class="task-list"></div>
          <p id="done-empty" class="empty-copy">完成的待办会出现在这里。</p>
        </section>
      </div>
      <footer class="task-foot">
        <button type="button" id="new-task" class="ghost-button">＋ 新建待办</button>
        <button type="button" id="confirm-done" class="primary-button" disabled>勾选已完成的待办</button>
        <p>勾选后会把完成情况发回对话，由助手更新列表；需要提醒时请明确时间。</p>
      </footer>
    </aside>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script data-world-script>
(() => {
"use strict";
const world = window.world;
const $ = (id) => document.getElementById(id);
const qsa = (selector) => Array.from(document.querySelectorAll(selector));
const el = (tag, className = '', text = '') => {
    const node = document.createElement(tag);
    if (className)
        node.className = className;
    if (text)
        node.textContent = text;
    return node;
};
const valueText = (value) => typeof value === 'string' ? value : value == null ? '' : JSON.stringify(value);
const input = $('input');
const messages = $('messages');
const statusNode = $('status');
const send = $('send');
let state = {};
let tab = 'chat';
let sending = false;
let localError = '';
let draftDirty = false;
let forceFollow = false;
let messagesKey = '';
let editingTurn;
const expanded = new Set();
const answering = new Set();
const checkedItems = new Set();
function errorText(error) { return error instanceof Error ? error.message : String(error); }
function showError(error) {
    localError = errorText(error);
    const banner = $('page-error');
    if (banner) {
        banner.textContent = localError;
        banner.hidden = false;
    }
    updateStatus();
}
function run(work) { void work().catch(showError); }
function setText(id, text) { const node = $(id); if (node)
    node.textContent = text; }
function clearError() {
    localError = '';
    const banner = $('page-error');
    if (banner)
        banner.hidden = true;
    updateStatus();
}
function attribute(key) { return state.attributes?.[key]; }
function listAttribute(key) {
    const value = attribute(key);
    if (Array.isArray(value))
        return value.map((item) => valueText(item)).filter(Boolean);
    if (typeof value === 'string' && value) {
        try {
            const parsed = JSON.parse(value);
            if (Array.isArray(parsed))
                return parsed.map((item) => valueText(item)).filter(Boolean);
        }
        catch {
            return value.split('\n').map((item) => item.trim()).filter(Boolean);
        }
    }
    return [];
}
function messageText(message) {
    if (typeof message.content === 'string')
        return message.content;
    return message.content.filter((part) => part.type === 'text').map((part) => part.text || '').join('\n');
}
function messageParts(message) { return typeof message.content === 'string' ? [] : message.content; }
function updateStatus() {
    const error = localError || state.errors?.action_error || state.errors?.page_error || state.ui_state?.page_error;
    statusNode.textContent = error || (sending || state.ui_state?.submitting ? '行程助手正在安排…' : '');
    statusNode.setAttribute('role', error ? 'alert' : 'status');
    statusNode.classList.toggle('has-error', Boolean(error));
    send.disabled = sending || !!state.ui_state?.submitting;
    send.textContent = sending || state.ui_state?.submitting ? '发送中' : state.editing ? '保存并重发' : '发送';
}
async function submit(options) {
    if (sending || state.ui_state?.submitting) {
        showError('上一条消息仍在处理，请稍候。');
        return false;
    }
    const content = options?.content ?? input.value.trim();
    if (!content && !state.draft_input?.audios?.length) {
        showError('先写下要安排的事情，或录一段语音。');
        return false;
    }
    sending = true;
    localError = '';
    forceFollow = true;
    updateStatus();
    try {
        await world.actions.clearError();
        await world.actions.submitMessage({ content, mode: options?.mode ?? (state.editing ? 'edit' : 'submit'), turnIndex: options?.turnIndex ?? state.editing?.turnIndex });
        if (!options && input.value.trim() === content) {
            input.value = '';
            draftDirty = false;
        }
        return true;
    }
    catch (error) {
        showError(error);
        return false;
    }
    finally {
        sending = false;
        updateStatus();
    }
}
send.type = 'button';
send.onclick = () => void submit();
input.oninput = () => { draftDirty = true; };
input.onkeydown = (event) => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && document.body.dataset.platform !== 'mobile') {
        event.preventDefault();
        void submit();
    }
};
window.addEventListener('world-error', (event) => showError(event.detail.message));
$('voice')?.addEventListener('click', () => run(() => state.draft_input?.is_recording ? world.actions.stopRecording() : world.actions.startRecording()));
$('cancel-edit')?.addEventListener('click', () => run(() => world.actions.cancelEdit()));
function cot(text, title, key, streaming) {
    const root = el('section', 'game-cot');
    root.dataset.streaming = String(streaming);
    root.append(el('div', 'game-cot-label', title), el('div', 'game-cot-content', expanded.has(key) ? text : text.slice(0, 200)));
    if (text.length > 200) {
        const toggle = el('button', 'cot-toggle', expanded.has(key) ? '收起' : '展开全部');
        toggle.type = 'button';
        toggle.onclick = () => { if (expanded.has(key))
            expanded.delete(key);
        else
            expanded.add(key); messagesKey = ''; renderMessages(state); };
        root.append(toggle);
    }
    return root;
}
function interactionFrom(value) {
    if (!value || typeof value !== 'object' || Array.isArray(value))
        return null;
    const item = value;
    if (typeof item.interaction_id !== 'string' || typeof item.kind !== 'string')
        return null;
    return {
        interaction_id: item.interaction_id,
        kind: item.kind,
        prompt: typeof item.prompt === 'string' ? item.prompt : '',
        config: item.config && typeof item.config === 'object' && !Array.isArray(item.config) ? item.config : {},
        status: typeof item.status === 'string' ? item.status : 'pending',
        answer: item.answer,
    };
}
function renderInteraction(messageId, interaction, submitting) {
    const root = el('article', 'message message--interaction');
    root.append(el('div', 'speaker', '需要你决定'), el('div', 'interaction-prompt', interaction.prompt));
    const answerKey = `${messageId}:${interaction.interaction_id}`;
    const disabled = interaction.status !== 'pending' || submitting || answering.has(answerKey) || !messageId;
    const options = Array.isArray(interaction.config.options) ? interaction.config.options.filter((item) => !!item && typeof item === 'object' && typeof item.id === 'string') : [];
    const answer = (value) => {
        if (disabled)
            return;
        answering.add(answerKey);
        messagesKey = '';
        renderMessages(state);
        void world.actions.answerInteraction(messageId, interaction.interaction_id, value)
            .catch(showError)
            .finally(() => { answering.delete(answerKey); messagesKey = ''; renderMessages(state); });
    };
    if (interaction.status !== 'pending') {
        root.append(el('div', 'interaction-answer', '已提交'));
        return root;
    }
    const controls = el('div', 'interaction-controls');
    if (interaction.kind === 'choice') {
        for (const option of options) {
            const button = el('button', 'interaction-option', valueText(option.label || option.id));
            button.type = 'button';
            button.disabled = disabled;
            button.onclick = () => answer(option.id);
            controls.append(button);
        }
    }
    else if (interaction.kind === 'confirm') {
        for (const [value, label] of [[true, interaction.config.confirm_label || '确认'], [false, interaction.config.cancel_label || '取消']]) {
            const button = el('button', 'interaction-option', valueText(label));
            button.type = 'button';
            button.disabled = disabled;
            button.onclick = () => answer(value);
            controls.append(button);
        }
    }
    else if (interaction.kind === 'slider') {
        const min = Number(interaction.config.min), max = Number(interaction.config.max);
        if (Number.isFinite(min) && Number.isFinite(max) && max > min) {
            const step = Number(interaction.config.step) > 0 ? Number(interaction.config.step) : 1;
            const range = el('input', 'interaction-slider');
            range.type = 'range';
            range.min = String(min);
            range.max = String(max);
            range.step = String(step);
            range.value = String(Math.max(min, Math.min(max, Number(interaction.config.default ?? min))));
            range.disabled = disabled;
            const output = el('output', 'interaction-slider-value', range.value);
            range.oninput = () => { output.value = range.value; output.textContent = range.value; };
            const submitRange = el('button', 'interaction-option', '确认');
            submitRange.type = 'button';
            submitRange.disabled = disabled;
            submitRange.onclick = () => answer(Number(range.value));
            controls.append(range, output, submitRange);
        }
    }
    if (controls.childElementCount)
        root.append(controls);
    return root;
}
function renderMessages(snapshot) {
    const signature = JSON.stringify([snapshot.messages, snapshot.ui_state?.submitting, snapshot.editing]);
    if (signature === messagesKey)
        return;
    messagesKey = signature;
    const follow = forceFollow || messages.scrollHeight - messages.scrollTop - messages.clientHeight < 80;
    const oldTop = messages.scrollTop;
    messages.replaceChildren();
    for (const [index, message] of (snapshot.messages || []).entries()) {
        const meta = message.metadata || {};
        const key = message.message_id || `${message.role}:${index}`;
        if (meta.message_kind === 'world_interaction') {
            const interaction = interactionFrom(meta.interaction);
            if (interaction)
                messages.append(renderInteraction(message.message_id || '', interaction, !!snapshot.ui_state?.submitting));
            continue;
        }
        if (['character_creation', 'switch_proposal'].includes(String(meta.message_kind)))
            continue;
        const isDirector = meta.action_type === 'director_trace';
        const streaming = meta.streaming === true;
        if (isDirector) {
            const text = valueText(meta.reasoning || meta.trace_text || messageText(message));
            if (text)
                messages.append(cot(text, '行程助手思考', key, streaming));
            continue;
        }
        const isPlayer = ['player', 'user'].includes(message.role);
        const isSystem = ['system', 'narration'].includes(message.role);
        const text = messageText(message);
        if (message.role === 'narration' || ['event', 'narration_event'].includes(String(meta.message_kind))) {
            if (text)
                messages.append(el('article', 'event', text));
            continue;
        }
        if (!text && !meta.reasoning && !meta.tool_activity && !messageParts(message).length)
            continue;
        const row = el('article', `message message--${isPlayer ? 'player' : isSystem ? 'system' : 'agent'}`);
        row.append(el('div', 'speaker', message.speaker || (isPlayer ? snapshot.player?.name || '我' : isSystem ? '提示' : '行程助手')));
        if (meta.reasoning)
            row.append(cot(valueText(meta.reasoning), '行程助手思考', key, streaming));
        const activity = meta.tool_activity;
        if (activity)
            row.append(el('div', 'tool' + (activity.status === 'calling' ? ' streaming' : ''), (activity.status === 'calling' ? '正在调用：' : '已调用：') + (activity.tools || []).map((tool) => tool.name).join('、')));
        if (text)
            row.append(el('div', 'message-content', text));
        for (const part of messageParts(message)) {
            if (part.type === 'image_url' && part.image_url?.url) {
                const image = el('img', 'message-image');
                image.src = part.image_url.url;
                image.alt = '图片附件';
                row.append(image);
            }
            else if (part.type === 'input_audio' && part.input_audio?.data) {
                const audio = el('audio', 'message-audio');
                audio.controls = true;
                audio.src = `data:audio/${part.input_audio.format || 'wav'};base64,${part.input_audio.data}`;
                row.append(audio);
            }
        }
        if (!isSystem && !message.pending) {
            const actions = el('div', 'message-actions');
            const button = (label, work) => {
                const node = el('button', '', label);
                node.type = 'button';
                node.disabled = !!snapshot.ui_state?.submitting;
                node.onclick = () => { const result = work(); if (result)
                    void result.catch(showError); };
                actions.append(node);
            };
            if (isPlayer) {
                const turn = Number(meta.turn_index);
                if (Number.isInteger(turn) && turn > 0) {
                    button('编辑', async () => { await world.actions.editTurn(text, turn); input.value = text; draftDirty = true; input.focus(); });
                    button('重发', () => submit({ content: text, mode: 'resend', turnIndex: turn }));
                }
            }
            else {
                button('复制', () => world.actions.copyText(text));
                button('分支', () => world.actions.branch());
            }
            if (actions.childElementCount)
                row.append(actions);
        }
        messages.append(row);
        if (meta.narration)
            messages.append(el('article', 'message message--system', valueText(meta.narration)));
    }
    if (!(snapshot.messages || []).length)
        messages.append(el('p', 'empty', '告诉行程助手接下来要做什么、什么时候做，以及希望提前多久收到提醒。'));
    if (snapshot.ui_state?.submitting)
        messages.append(el('div', 'thinking-indicator', '行程助手正在拆解和安排…'));
    messages.scrollTop = follow ? messages.scrollHeight : oldTop;
    forceFollow = false;
}
function switchTab(next) {
    tab = next;
    for (const panel of qsa('[data-tab-panel]'))
        panel.hidden = panel.dataset.tabPanel !== next;
    for (const button of qsa('[data-tab]')) {
        const active = button.dataset.tab === next;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-current', active ? 'page' : 'false');
    }
    if (next === 'tasks')
        renderTasks(state);
}
function renderTasks(snapshot) {
    const todo = listAttribute('todo_items');
    const done = listAttribute('completed_items');
    const valid = new Set(todo);
    for (const item of Array.from(checkedItems))
        if (!valid.has(item))
            checkedItems.delete(item);
    setText('todo-count', String(todo.length));
    setText('done-count', String(done.length));
    setText('tab-todo-count', todo.length ? String(todo.length) : '');
    const todoRoot = $('todo-list');
    if (todoRoot) {
        todoRoot.replaceChildren();
        const empty = $('todo-empty');
        if (empty)
            empty.hidden = todo.length > 0;
        for (const item of todo) {
            const label = el('label', `task-row${checkedItems.has(item) ? ' is-checked' : ''}`);
            const box = el('input');
            box.type = 'checkbox';
            box.checked = checkedItems.has(item);
            box.onchange = () => {
                if (box.checked)
                    checkedItems.add(item);
                else
                    checkedItems.delete(item);
                label.classList.toggle('is-checked', box.checked);
                renderConfirm();
            };
            const copy = el('span', 'task-text');
            copy.append(el('strong', '', item));
            label.append(box, copy);
            todoRoot.append(label);
        }
    }
    const doneRoot = $('done-list');
    if (doneRoot) {
        doneRoot.replaceChildren();
        const empty = $('done-empty');
        if (empty)
            empty.hidden = done.length > 0;
        for (const item of done) {
            const row = el('div', 'task-row task-row--done');
            row.append(el('span', 'task-check', '✓'), el('span', 'task-text', item));
            doneRoot.append(row);
        }
    }
    renderConfirm();
}
function renderConfirm() {
    const button = $('confirm-done');
    if (!button)
        return;
    button.disabled = checkedItems.size === 0;
    button.textContent = checkedItems.size ? `确认完成 ${checkedItems.size} 项` : '勾选已完成的待办';
}
function render(snapshot) {
    state = snapshot;
    if (snapshot.draft_input?.microphone_error)
        localError = snapshot.draft_input.microphone_error;
    setText('world-name', snapshot.world?.name || '行程助手');
    setText('time-label', snapshot.session?.time_label || '实时');
    renderMessages(snapshot);
    renderTasks(snapshot);
    if (snapshot.editing?.turnIndex !== editingTurn) {
        editingTurn = snapshot.editing?.turnIndex;
        if (snapshot.editing) {
            input.value = snapshot.draft_input?.value || snapshot.editing.originalContent;
            draftDirty = true;
        }
    }
    if (!draftDirty && !sending && document.activeElement !== input)
        input.value = snapshot.draft_input?.value || '';
    const cancel = $('cancel-edit');
    if (cancel)
        cancel.hidden = !snapshot.editing;
    const voice = $('voice');
    if (voice) {
        voice.setAttribute('aria-label', snapshot.draft_input?.is_recording ? '结束录音' : '开始录音');
        voice.classList.toggle('recording', !!snapshot.draft_input?.is_recording);
    }
    const attachments = $('attachments');
    if (attachments) {
        attachments.replaceChildren();
        for (const [index, file] of (snapshot.draft_input?.audios || []).entries()) {
            const chip = el('button', 'attachment', `${file.name || '语音'} ×`);
            chip.type = 'button';
            chip.onclick = () => run(() => world.actions.removeAudio(index));
            attachments.append(chip);
        }
    }
    updateStatus();
}
let toastTimer = 0;
function toast(message) {
    const node = $('toast');
    if (!node)
        return;
    node.textContent = message;
    node.classList.add('show');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => node.classList.remove('show'), 2200);
}
function hydrate() {
    for (const button of qsa('[data-tab]'))
        button.addEventListener('click', () => switchTab(button.dataset.tab || 'chat'));
    $('new-task')?.addEventListener('click', () => {
        switchTab('chat');
        if (!input.value)
            input.value = '帮我安排：';
        draftDirty = true;
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
    });
    $('confirm-done')?.addEventListener('click', () => {
        if (!checkedItems.size)
            return;
        const items = Array.from(checkedItems);
        void submit({ content: `我已完成以下待办事项：${items.join('；')}` }).then((ok) => {
            if (!ok)
                return;
            checkedItems.clear();
            renderTasks(state);
            toast('已告诉行程助手');
        });
    });
    switchTab('chat');
}
function boot() {
    hydrate();
    world.subscribe((next) => {
        state = next;
        render(next);
    });
}
boot();

})();
</script>
