<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凡人修仙 · 小石村问道</title>
<style>
html{color-scheme:dark}html,body{height:100%;margin:0}*,*::before,*::after{box-sizing:border-box}
</style>
<style data-html-runtime>
/* 凡人修仙 · 青墨卷 — shared visual layer for desktop and mobile. */
:root {
  --m-bg: #131916;
  --m-panel: #1d2621;
  --m-panel-2: #24302a;
  --m-line: rgba(236, 240, 229, 0.11);
  --m-line-strong: rgba(236, 240, 229, 0.2);
  --m-paper: #f6f1e4;
  --m-paper-2: #ece4d1;
  --m-paper-line: #d8cdb6;
  --m-ink: #29322b;
  --m-ink-soft: #5d685d;
  --m-muted: #9aa79a;
  --m-jade: #5d8f72;
  --m-jade-deep: #3d6a53;
  --m-gold: #c6a86c;
  --m-gold-soft: #e0cb9a;
  --m-cinnabar: #a74b3e;
  --m-serif: Georgia, "Songti SC", "Noto Serif SC", "STSong", serif;
}

html, body { height: 100%; }

body {
  color: #e9ede4;
  background:
    radial-gradient(120% 80% at 10% 0%, #223029 0%, transparent 55%),
    radial-gradient(90% 60% at 90% 100%, #1a2620 0%, transparent 60%),
    var(--m-bg);
  font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.button {
  min-height: 34px;
  padding: 7px 13px;
  border: 1px solid var(--m-line-strong);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  color: #dde5da;
  font: 600 12px/1.2 inherit;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
}

.button:hover,
.button:focus-visible {
  border-color: var(--m-gold);
  color: var(--m-gold-soft);
  outline: none;
  background: rgba(198, 168, 108, 0.08);
}

.button.primary,
.send {
  border-color: var(--m-jade-deep);
  background: linear-gradient(180deg, #5f9274, #447054);
  color: #f6f4ea;
}

.button.primary:hover,
.send:hover {
  border-color: var(--m-jade);
  color: #fffdf4;
}

/* ── Desktop frame ─────────────────────────────────────────────── */
body[data-platform="desktop"] {
  display: grid;
  grid-template-columns: 244px minmax(0, 1fr) 380px;
  grid-template-rows: 60px minmax(0, 1fr) auto;
  overflow: hidden;
}

body[data-platform="desktop"] .top {
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
  padding: 0 22px;
  background: linear-gradient(180deg, rgba(29, 38, 33, 0.96), rgba(24, 32, 27, 0.9));
  border-bottom: 1px solid var(--m-line);
  color: #eef1e6;
}

body[data-platform="desktop"] .top h1 {
  margin: 0;
  font: 600 20px/1.2 var(--m-serif);
  letter-spacing: 0.08em;
}

body[data-platform="desktop"] .top small {
  display: block;
  margin-top: 4px;
  color: var(--m-muted);
  font-size: 11.5px;
  letter-spacing: 0.04em;
}

body[data-platform="desktop"] .top .tools {
  margin-left: auto;
  display: flex;
  gap: 7px;
}

body[data-platform="desktop"] .scene {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  min-height: 0;
  gap: 12px;
  padding: 16px 14px;
  overflow: auto;
  background: linear-gradient(180deg, #1f2a24, #19221d);
  border-right: 1px solid var(--m-line);
}

body[data-platform="desktop"] .panel-title {
  margin: 4px 0 -2px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--m-gold);
  font: 600 11px/1.2 var(--m-serif);
  letter-spacing: 0.18em;
}

body[data-platform="desktop"] .panel-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(198, 168, 108, 0.4), transparent);
}

body[data-platform="desktop"] .focus {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin: 0;
  border: 1px solid var(--m-line);
  border-radius: 12px;
  overflow: hidden;
  background: #1a241e;
}

body[data-platform="desktop"] .focus-image {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  min-height: 148px;
  max-height: 260px;
  padding: 16px;
  color: #d8e2d6;
  background:
    radial-gradient(90% 90% at 50% 10%, rgba(93, 143, 114, 0.22), transparent 70%),
    #16201a;
  font: 18px/1.5 var(--m-serif);
  text-align: center;
}

body[data-platform="desktop"] .focus-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

body[data-platform="desktop"] .focus-line {
  max-height: 108px;
  overflow: auto;
  padding: 11px 13px;
  border-top: 1px solid var(--m-line);
  color: #aeb9ab;
  background: #151d18;
  font-size: 12px;
  line-height: 1.75;
}

body[data-platform="desktop"] .roster {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
}

body[data-platform="desktop"] .pill {
  display: inline-flex;
  align-items: center;
  padding: 5px 9px;
  border: 1px solid var(--m-line);
  border-radius: 999px;
  color: #dbe4d8;
  background: rgba(255, 255, 255, 0.04);
  font-size: 11.5px;
}

body[data-platform="desktop"] .stat {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dashed rgba(236, 240, 229, 0.1);
  color: var(--m-muted);
  font-size: 12px;
}

body[data-platform="desktop"] .stat b {
  color: #eef2e7;
  font-weight: 500;
  text-align: right;
}

body[data-platform="desktop"] .travel {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top: auto;
  padding-bottom: 2px;
}

body[data-platform="desktop"] .story {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.35), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.35)),
    var(--m-paper);
  color: var(--m-ink);
}

body[data-platform="desktop"] .story-head {
  flex-shrink: 0;
  padding: 20px clamp(20px, 3.4vw, 46px) 14px;
  border-bottom: 1px solid rgba(41, 50, 43, 0.12);
  background: linear-gradient(180deg, #f1ead9, rgba(241, 234, 217, 0.4));
}

body[data-platform="desktop"] .story-head h2 {
  margin: 0;
  color: #31463b;
  font: 600 24px/1.25 var(--m-serif);
  letter-spacing: 0.06em;
}

body[data-platform="desktop"] .story-head p {
  margin: 6px 0 0;
  color: var(--m-ink-soft);
  font-size: 12px;
}

body[data-platform="desktop"] .narration {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  gap: 10px;
  padding: 10px clamp(20px, 3.4vw, 46px);
  border-bottom: 1px solid rgba(41, 50, 43, 0.1);
  border-left: 3px solid rgba(167, 75, 62, 0.55);
  color: #6a7267;
  background: #efe7d5;
  font-size: 12px;
  line-height: 1.7;
}

body[data-platform="desktop"] .narration strong {
  color: var(--m-cinnabar);
  font: 600 11px/1.7 var(--m-serif);
  letter-spacing: 0.2em;
}

body[data-platform="desktop"] .narration span {
  display: -webkit-box;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

body[data-platform="desktop"] .event {
  width: min(100%, 760px);
  margin: 0 auto 18px;
  color: #43483f;
  font: 16px/2 var(--m-serif);
  letter-spacing: 0.01em;
  text-indent: 2em;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

body[data-platform="desktop"] .messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 22px clamp(20px, 3.4vw, 46px) 28px;
  scrollbar-gutter: stable;
}

body[data-platform="desktop"] .message {
  width: min(100%, 760px);
  margin: 0 auto 16px;
  padding: 14px 16px;
  border: 1px solid var(--m-paper-line);
  border-radius: 10px;
  background: rgba(255, 253, 246, 0.86);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7), 0 8px 20px rgba(60, 54, 38, 0.05);
  line-height: 1.85;
  white-space: normal;
  overflow-wrap: anywhere;
}

body[data-platform="desktop"] .message--player {
  margin-right: 0;
  margin-left: auto;
  border-color: rgba(93, 143, 114, 0.42);
  background: linear-gradient(180deg, #e6efe4, #dce9dc);
}

body[data-platform="desktop"] .message--system {
  max-width: 100%;
  padding: 9px 13px;
  border-color: rgba(167, 75, 62, 0.22);
  border-left: 3px solid rgba(167, 75, 62, 0.55);
  background: #f0e7d8;
  color: #7d554e;
  box-shadow: none;
}

body[data-platform="desktop"] .speaker {
  margin-bottom: 6px;
  color: var(--m-jade-deep);
  font: 600 11px/1.3 var(--m-serif);
  letter-spacing: 0.16em;
}

body[data-platform="desktop"] .message--player .speaker {
  color: #3d6a53;
  text-align: right;
}

body[data-platform="desktop"] .message-content {
  font-size: 14px;
  line-height: 1.9;
  white-space: pre-wrap;
}

body[data-platform="desktop"] .message-actions {
  display: flex;
  gap: 5px;
  margin-top: 9px;
}

body[data-platform="desktop"] .message-actions button {
  padding: 3px 8px;
  border: 1px solid rgba(41, 50, 43, 0.16);
  border-radius: 5px;
  background: transparent;
  color: #7a8275;
  font-size: 10.5px;
  cursor: pointer;
}

body[data-platform="desktop"] .message-actions button:hover {
  border-color: var(--m-jade);
  color: var(--m-jade-deep);
}

body[data-platform="desktop"] .cot {
  margin-bottom: 10px;
  padding: 9px 11px;
  border: 1px dashed rgba(120, 112, 88, 0.4);
  border-radius: 7px;
  background: #efe9da;
  color: #6a7065;
  font-size: 11.5px;
  line-height: 1.7;
}

body[data-platform="desktop"] .cot summary {
  color: #7a806f;
  font-weight: 650;
  cursor: pointer;
}

body[data-platform="desktop"] .tool {
  margin-top: 7px;
  padding: 6px 9px;
  border-left: 2px solid rgba(93, 143, 114, 0.5);
  color: #6d7f70;
  background: rgba(93, 143, 114, 0.09);
  font-size: 11px;
}

body[data-platform="desktop"] .empty,
body[data-platform="desktop"] .loading {
  padding: 40px 16px;
  color: #858c7e;
  text-align: center;
  font-size: 13px;
}

body[data-platform="desktop"] .error,
body[data-platform="desktop"] .has-error {
  padding: 9px 12px;
  border: 1px solid rgba(167, 75, 62, 0.45);
  border-radius: 7px;
  color: #8f3f34;
  background: #f2ded7;
  font-size: 12px;
}

body[data-platform="desktop"] .message--interaction {
  border-color: rgba(179, 143, 76, 0.6);
  background: #f3ecdb;
}

body[data-platform="desktop"] .interaction-prompt {
  color: #55462c;
  font-weight: 600;
  line-height: 1.7;
  white-space: pre-wrap;
}

body[data-platform="desktop"] .interaction-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}

body[data-platform="desktop"] .interaction-option {
  min-height: 34px;
  padding: 7px 13px;
  border: 1px solid #b9a980;
  border-radius: 7px;
  background: #fffdf5;
  color: #3c4b3e;
  cursor: pointer;
}

body[data-platform="desktop"] .interaction-option:hover {
  border-color: var(--m-jade-deep);
}

body[data-platform="desktop"] .interaction-option:disabled {
  opacity: 0.5;
  cursor: default;
}

body[data-platform="desktop"] .interaction-slider {
  flex: 1;
  min-width: 150px;
  accent-color: var(--m-jade-deep);
}

body[data-platform="desktop"] .interaction-answer {
  margin-top: 9px;
  color: #67725f;
  font-size: 12px;
}

body[data-platform="desktop"] .bottom {
  grid-column: 2;
  grid-row: 3;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 13px clamp(20px, 3.4vw, 46px) 16px;
  background: linear-gradient(180deg, #efe7d5, #e9dfca);
  border-top: 1px solid rgba(41, 50, 43, 0.12);
}

body[data-platform="desktop"] .bottom textarea {
  width: 100%;
  min-height: 58px;
  padding: 11px 13px;
  border: 1px solid #c3b79f;
  border-radius: 9px;
  background: rgba(255, 253, 247, 0.92);
  color: var(--m-ink);
  font: 13.5px/1.65 inherit;
  resize: none;
}

body[data-platform="desktop"] .bottom textarea:focus {
  border-color: var(--m-jade);
  outline: 2px solid rgba(93, 143, 114, 0.22);
}

body[data-platform="desktop"] .composer-tools {
  display: flex;
  align-items: center;
  gap: 7px;
}

body[data-platform="desktop"] .composer-tools .send {
  margin-left: auto;
  min-width: 104px;
  min-height: 36px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 12.5px;
  letter-spacing: 0.1em;
}

body[data-platform="desktop"] .icon-button {
  display: grid;
  place-items: center;
  width: 36px;
  height: 34px;
  padding: 7px;
  border: 1px solid #b9ad95;
  border-radius: 7px;
  background: rgba(255, 253, 247, 0.6);
  color: #57614f;
  cursor: pointer;
}

body[data-platform="desktop"] .icon-button svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
}

body[data-platform="desktop"] .icon-button.recording {
  border-color: var(--m-cinnabar);
  background: #a9493f;
  color: #f8f1e4;
}

body[data-platform="desktop"] .attachments {
  display: flex;
  gap: 6px;
  overflow: auto;
}

body[data-platform="desktop"] .attachment {
  padding: 4px 9px;
  border: 1px solid #b9ad95;
  border-radius: 6px;
  color: #57614f;
  background: rgba(255, 253, 247, 0.7);
  font-size: 11px;
  white-space: nowrap;
}

body[data-platform="desktop"] .status {
  margin: 0;
  color: #767c6c;
  font-size: 11.5px;
}

body[data-platform="desktop"] .ledger {
  grid-column: 3;
  grid-row: 2 / 4;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 16px 14px;
  overflow: hidden;
  background: linear-gradient(180deg, #202b25, #18211c);
  border-left: 1px solid var(--m-line);
}

body[data-platform="desktop"] .ledger > .panel-title {
  margin: 2px 0 10px;
}

body[data-platform="desktop"] .tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--m-line);
}

body[data-platform="desktop"] .tabs .button {
  min-height: 28px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  color: #b9c4b6;
  background: transparent;
}

body[data-platform="desktop"] .tabs .button.active {
  border-color: rgba(198, 168, 108, 0.55);
  background: rgba(198, 168, 108, 0.12);
  color: var(--m-gold-soft);
}

body[data-platform="desktop"] .ledger-content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-top: 12px;
}

body[data-platform="desktop"] .attribute {
  margin-bottom: 8px;
  padding: 10px 11px;
  border: 1px solid var(--m-line);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.035);
}

body[data-platform="desktop"] .attribute-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: #a8b3a4;
  font-size: 11.5px;
}

body[data-platform="desktop"] .attribute-head b,
body[data-platform="desktop"] .attribute-value {
  color: #eef2e7;
  font-weight: 500;
}

body[data-platform="desktop"] .attribute-text {
  margin-top: 6px;
  color: #dbe4d7;
  font-size: 12.5px;
  line-height: 1.8;
  white-space: pre-wrap;
}

body[data-platform="desktop"] .meter {
  height: 5px;
  margin-top: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.35);
}

body[data-platform="desktop"] .meter i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--m-jade-deep), var(--m-gold));
}

body[data-platform="desktop"] .list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 7px;
}

body[data-platform="desktop"] .list span {
  padding: 3px 8px;
  border: 1px solid rgba(236, 240, 229, 0.09);
  border-radius: 6px;
  color: #d9e2d5;
  background: rgba(0, 0, 0, 0.2);
  font-size: 11px;
}

body[data-platform="desktop"] .map {
  display: grid;
  gap: 7px;
}

body[data-platform="desktop"] .map-node {
  padding: 9px 11px;
  border: 1px solid var(--m-line-strong);
  border-radius: 8px;
  color: #d6e0d2;
  background: rgba(255, 255, 255, 0.03);
  font-size: 12px;
}

body[data-platform="desktop"] .map-node.current {
  border-color: rgba(198, 168, 108, 0.7);
  background: rgba(198, 168, 108, 0.14);
  color: #f0e2bd;
}

body[data-platform="desktop"] .topology {
  height: 440px;
  min-height: 260px;
  overflow: hidden;
  border: 1px solid var(--m-line);
  border-radius: 10px;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(93, 143, 114, 0.14), transparent 70%),
    #141c17;
  touch-action: none;
}

body[data-platform="desktop"] .topology svg {
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}

body[data-platform="desktop"] .topology-edge {
  stroke: #68806f;
  fill: none;
  stroke-width: 1.6;
  vector-effect: non-scaling-stroke;
}

body[data-platform="desktop"] .topology-edge.current {
  stroke: var(--m-gold);
  stroke-dasharray: 6 4;
  animation: map-path-flow 2.4s linear infinite;
}

body[data-platform="desktop"] .topology-node rect {
  fill: #26332b;
  stroke: #6f8878;
  stroke-width: 1;
}

body[data-platform="desktop"] .topology-node text {
  fill: #e2e9de;
  font: 12.5px system-ui;
}

body[data-platform="desktop"] .topology-node.current rect {
  fill: #3f3a29;
  stroke: var(--m-gold);
  stroke-width: 1.6;
}

body[data-platform="desktop"] .topology-node.undiscovered rect {
  fill: #1c251f;
  stroke-dasharray: 4 3;
}

body[data-platform="desktop"] .topology-node.undiscovered text {
  fill: #93a091;
}

body[data-platform="desktop"] .map-controls {
  display: flex;
  gap: 6px;
  margin-top: 9px;
}

body[data-platform="desktop"] .map-controls .button {
  min-height: 28px;
  padding: 4px 10px;
  font-size: 11px;
}

body[data-platform="desktop"] .map-summary {
  color: var(--m-gold-soft);
  font-size: 12.5px;
}

body[data-platform="desktop"] .map-hint {
  color: #99a597;
  font-size: 11px;
}

body[data-platform="desktop"] .game-cot {
  max-width: 760px;
  margin: 0 auto 12px;
  padding: 9px 11px;
  border: 1px dashed rgba(120, 112, 88, 0.4);
  border-radius: 7px;
  background: #efe9da;
  color: #697064;
  font-size: 11.5px;
  line-height: 1.7;
}

body[data-platform="desktop"] .game-cot-content {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

body[data-platform="desktop"] .cot-toggle {
  margin-top: 5px;
  padding: 3px 7px;
  border: 1px solid rgba(93, 143, 114, 0.45);
  border-radius: 5px;
  background: transparent;
  color: #496450;
  font-size: 10.5px;
  cursor: pointer;
}

body[data-platform="desktop"] .thinking-indicator {
  padding: 10px;
  color: #6a7568;
  font-size: 12px;
}

/* ── Mobile frame ──────────────────────────────────────────────── */
body[data-platform="mobile"] {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-height: 100%;
  overflow: hidden;
}

body[data-platform="mobile"] .top {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 10px 12px;
  background: linear-gradient(180deg, rgba(31, 42, 36, 0.98), rgba(24, 32, 27, 0.94));
  border-bottom: 1px solid var(--m-line);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
  z-index: 5;
}

body[data-platform="mobile"] .top > div:first-child {
  flex: 1;
  min-width: 0;
}

body[data-platform="mobile"] .top h1 {
  margin: 0;
  overflow: hidden;
  color: #f0f2e8;
  font: 600 17px/1.3 var(--m-serif);

        prompt: typeof item.prompt === 'string' ? item.prompt : '',

            button.onclick = () => answer(item.id);

        toggle(false); });
}
const ledgerToggle = $('ledger-toggle'), ledgerPanel = $('ledger');
if (ledgerToggle && ledgerPanel) {
    const collapse = (collapsed) => {
        document.body.classList.toggle('ledger-collapsed', collapsed);
        ledgerToggle.setAttribute('aria-pressed', String(!collapsed));
        ledgerToggle.textContent = collapsed ? '行囊 ›' : '行囊';
    };
    collapse(false);
    ledgerToggle.onclick = () => collapse(!document.body.classList.contains('ledger-collapsed'));
}
world.subscribe(render);

})();
</script>
</body>
</html>
